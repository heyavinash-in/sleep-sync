<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SleepSync — Ambient Sounds & Sleep Timer</title>
    <meta name="description" content="Mix calming ambient sounds, create your perfect sleep environment, and fall asleep with a customizable timer.">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col items-center selection:bg-indigo-500/30">
    
    <div class="max-w-3xl w-full">
        <!-- Header -->
        <header class="text-center mt-6 mb-12 hide-in-sleep flex flex-col items-center">
            <h1 class="text-5xl font-bold mb-3 text-indigo-400 tracking-tight">SleepSync</h1>
            <p class="text-slate-400 text-lg mb-6">Your personal ambient environment.</p>
            <button id="btn-sleep-mode" onclick="toggleSleepMode()" class="px-6 py-2 rounded-full border bg-slate-800 text-indigo-200 border-slate-700 hover:border-indigo-500 transition-colors shadow-lg shadow-indigo-900/20 text-sm font-medium">
                Enter Sleep Mode
            </button>
        </header>

        <!-- Main Mixer Section -->
        <section id="mixer-container" class="mb-10 hidden transition-all duration-500">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold text-indigo-300">Current Mix</h2>
                <button id="btn-save-mix" class="text-sm px-4 py-2 bg-slate-800 hover:bg-indigo-600 text-indigo-200 rounded-lg border border-slate-700 transition-colors hide-in-sleep">
                    Save Mix
                </button>
            </div>
            
            <div id="active-mixer" class="space-y-3 mb-6">
                <!-- Active sound rows injected here -->
            </div>

            <!-- Master Volume -->
            <div class="bg-slate-900/50 p-5 rounded-2xl border border-slate-800">
                <div class="flex justify-between text-sm mb-3">
                    <span class="font-medium text-slate-300">Master Volume</span>
                </div>
                <input type="range" id="master-volume" min="0" max="1" step="0.01" value="1" class="w-full accent-indigo-500">
            </div>
        </section>

        <!-- Sound Library -->
        <section class="mb-12 hide-in-sleep">
            <h2 class="text-xl font-semibold text-slate-300 mb-4">Sound Library</h2>
            <div class="grid grid-cols-2 md:grid-cols-3 gap-4" id="sound-library">
                <!-- Sound cards injected here -->
            </div>
        </section>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-12 hide-in-sleep">
            <!-- Presets -->
            <section>
                <h2 class="text-xl font-semibold text-slate-300 mb-4">Presets</h2>
                <div class="flex flex-col gap-3" id="presets-list">
                    <!-- Preset buttons injected here -->
                </div>
            </section>

            <!-- Saved Mixes -->
            <section>
                <h2 class="text-xl font-semibold text-slate-300 mb-4">My Mixes</h2>
                <div class="flex flex-col gap-3" id="saved-mixes-list">
                    <!-- Saved mix rows injected here -->
                </div>
            </section>
        </div>

        <!-- Sleep Timer -->
        <section class="mb-12 bg-slate-900/50 p-6 rounded-2xl border border-slate-800 flex flex-col items-center">
            <h2 class="text-xl mb-6 font-semibold text-indigo-300 flex items-center gap-2">
                <span>⏱️</span> Sleep Timer
            </h2>
            
            <div id="timer-controls" class="w-full flex flex-col items-center">
                <div class="flex flex-wrap justify-center gap-3 mb-6 w-full">
                    <button onclick="startTimer(15)" class="flex-1 py-3 bg-slate-800 hover:bg-indigo-600 rounded-xl font-medium transition-colors border border-slate-700 hover:border-indigo-500">15m</button>
                    <button onclick="startTimer(30)" class="flex-1 py-3 bg-slate-800 hover:bg-indigo-600 rounded-xl font-medium transition-colors border border-slate-700 hover:border-indigo-500">30m</button>
                    <button onclick="startTimer(60)" class="flex-1 py-3 bg-slate-800 hover:bg-indigo-600 rounded-xl font-medium transition-colors border border-slate-700 hover:border-indigo-500">1h</button>
                </div>
                <div class="flex items-center gap-3 w-full max-w-sm hide-in-sleep">
                    <input type="number" id="custom-timer-input" min="1" placeholder="Custom mins" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 text-slate-200 focus:outline-none focus:border-indigo-500">
                    <button onclick="startCustomTimer()" class="px-6 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg font-medium transition-colors whitespace-nowrap">Start</button>
                </div>
            </div>

            <div id="timer-display-container" class="hidden flex flex-col items-center w-full">
                <div id="countdown-text" class="text-5xl font-mono text-indigo-300 mb-6 font-light tracking-wider">00:00</div>
                <button onclick="stopTimer()" class="px-8 py-3 bg-red-900/30 hover:bg-red-900/60 rounded-xl text-red-300 font-medium transition-colors border border-red-900/50">Stop Timer</button>
            </div>
        </section>

    </div>

    <!-- Modular Scripts -->
    <script src="js/data.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/presets.js"></script>
    <script src="js/timer.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/ui.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.UI) window.UI.init();
        });
    </script>
</body>
</html>
